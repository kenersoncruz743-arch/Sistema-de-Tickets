<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Tickets</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 1200px;
            padding: 40px;
        }

        .hidden {
            display: none !important;
        }

        h1, h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #6c757d;
            margin-left: 10px;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-danger {
            background: #dc3545;
        }

        .auth-toggle {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .auth-toggle a {
            color: #667eea;
            cursor: pointer;
            text-decoration: underline;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .menu-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .menu-card:hover {
            transform: scale(1.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .ticket-list {
            display: grid;
            gap: 20px;
            margin-top: 20px;
        }

        .ticket-card {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .ticket-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .ticket-id {
            font-weight: bold;
            color: #667eea;
            font-size: 18px;
        }

        .ticket-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-open {
            background: #ffc107;
            color: #000;
        }

        .status-completed {
            background: #28a745;
            color: white;
        }

        .status-incomplete {
            background: #dc3545;
            color: white;
        }

        .comment {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 12px;
            color: #666;
        }

        .image-preview {
            max-width: 300px;
            max-height: 300px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .error {
            color: #dc3545;
            margin-top: 10px;
            padding: 10px;
            background: #f8d7da;
            border-radius: 5px;
        }

        .success {
            color: #28a745;
            margin-top: 10px;
            padding: 10px;
            background: #d4edda;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Tela de Login -->
        <div id="loginScreen">
            <h1>Sistema de Tickets</h1>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="loginPassword" placeholder="Sua senha">
            </div>
            <button onclick="login()">Entrar</button>
            <div class="auth-toggle">
                Não tem conta? <a onclick="showRegister()">Cadastre-se</a>
            </div>
            <div id="loginError"></div>
        </div>

        <!-- Tela de Registro -->
        <div id="registerScreen" class="hidden">
            <h1>Criar Conta</h1>
            <div class="form-group">
                <label>Nome</label>
                <input type="text" id="registerName" placeholder="Seu nome">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="registerEmail" placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="registerPassword" placeholder="Mínimo 6 caracteres">
            </div>
            <button onclick="register()">Cadastrar</button>
            <div class="auth-toggle">
                Já tem conta? <a onclick="showLogin()">Faça login</a>
            </div>
            <div id="registerError"></div>
        </div>

        <!-- Menu Principal -->
        <div id="menuScreen" class="hidden">
            <div class="header">
                <h1>Menu Principal</h1>
                <div class="user-info">
                    <span id="userName"></span>
                    <button class="btn-secondary" onclick="logout()">Sair</button>
                </div>
            </div>
            <div class="menu">
                <div class="menu-card" onclick="showTickets()">
                    <h2>📋 Tickets</h2>
                    <p>Ver e gerenciar tickets</p>
                </div>
                <div class="menu-card" onclick="showNewTicket()">
                    <h2>➕ Novo Ticket</h2>
                    <p>Criar novo ticket</p>
                </div>
            </div>
        </div>

        <!-- Tela de Novo Ticket -->
        <div id="newTicketScreen" class="hidden">
            <div class="header">
                <h2>Criar Novo Ticket</h2>
                <button class="btn-secondary" onclick="showMenu()">Voltar</button>
            </div>
            <div class="form-group">
                <label>Título</label>
                <input type="text" id="ticketTitle" placeholder="Título do ticket">
            </div>
            <div class="form-group">
                <label>Descrição</label>
                <textarea id="ticketDescription" placeholder="Descreva o problema ou solicitação"></textarea>
            </div>
            <div class="form-group">
                <label>Imagem (opcional)</label>
                <input type="file" id="ticketImage" accept="image/*">
            </div>
            <button onclick="createTicket()">Criar Ticket</button>
            <div id="newTicketMessage"></div>
        </div>

        <!-- Tela de Lista de Tickets -->
        <div id="ticketsScreen" class="hidden">
            <div class="header">
                <h2>Tickets</h2>
                <button class="btn-secondary" onclick="showMenu()">Voltar</button>
            </div>
            <div id="ticketsList" class="ticket-list"></div>
        </div>

        <!-- Tela de Detalhes do Ticket -->
        <div id="ticketDetailScreen" class="hidden">
            <div class="header">
                <h2 id="detailTicketId"></h2>
                <div>
                    <button class="btn-secondary" onclick="showTickets()">Voltar</button>
                    <button class="btn-success hidden" id="btnComplete" onclick="closeTicket('completed')">Concluir</button>
                    <button class="btn-danger hidden" id="btnIncomplete" onclick="closeTicket('incomplete')">Não Concluído</button>
                </div>
            </div>
            <div id="ticketDetail"></div>
            <div id="commentsList"></div>
            <div class="form-group" style="margin-top: 30px;">
                <label>Adicionar Comentário</label>
                <textarea id="commentText" placeholder="Escreva seu comentário"></textarea>
            </div>
            <div class="form-group">
                <label>Imagem (opcional)</label>
                <input type="file" id="commentImage" accept="image/*">
            </div>
            <button onclick="addComment()">Adicionar Comentário</button>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO DO SUPABASE
        const SUPABASE_URL = 'https://vzluevznabaqqvfmbwfx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6bHVldnpuYWJhcXF2Zm1id2Z4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ1OTMwODEsImV4cCI6MjA4MDE2OTA4MX0.vDyhCNLn-Tbzks1r8EKMoyDIppVad8udMfjZUsueq_0';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let currentTicketId = null;

        // Funções de Autenticação
        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');

            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                
                currentUser = data.user;
                await loadUserProfile();
                showMenu();
            } catch (error) {
                errorDiv.innerHTML = `<div class="error">${error.message}</div>`;
            }
        }

        async function register() {
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const errorDiv = document.getElementById('registerError');

            try {
                const { data, error } = await supabase.auth.signUp({
                    email,
                    password,
                    options: {
                        data: { name }
                    }
                });
                if (error) throw error;
                
                errorDiv.innerHTML = '<div class="success">Conta criada! Faça login para continuar.</div>';
                setTimeout(showLogin, 2000);
            } catch (error) {
                errorDiv.innerHTML = `<div class="error">${error.message}</div>`;
            }
        }

        async function loadUserProfile() {
            const { data } = await supabase.auth.getUser();
            if (data.user) {
                currentUser = data.user;
                document.getElementById('userName').textContent = data.user.user_metadata.name || data.user.email;
            }
        }

        async function logout() {
            await supabase.auth.signOut();
            currentUser = null;
            showLogin();
        }

        // Funções de Navegação
        function showLogin() {
            hideAllScreens();
            document.getElementById('loginScreen').classList.remove('hidden');
        }

        function showRegister() {
            hideAllScreens();
            document.getElementById('registerScreen').classList.remove('hidden');
        }

        function showMenu() {
            hideAllScreens();
            document.getElementById('menuScreen').classList.remove('hidden');
        }

        function showNewTicket() {
            hideAllScreens();
            document.getElementById('newTicketScreen').classList.remove('hidden');
        }

        async function showTickets() {
            hideAllScreens();
            document.getElementById('ticketsScreen').classList.remove('hidden');
            await loadTickets();
        }

        function hideAllScreens() {
            const screens = ['loginScreen', 'registerScreen', 'menuScreen', 'newTicketScreen', 'ticketsScreen', 'ticketDetailScreen'];
            screens.forEach(screen => document.getElementById(screen).classList.add('hidden'));
        }

        // Funções de Tickets
        function generateTicketId() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 7; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        async function createTicket() {
            const title = document.getElementById('ticketTitle').value;
            const description = document.getElementById('ticketDescription').value;
            const imageFile = document.getElementById('ticketImage').files[0];
            const messageDiv = document.getElementById('newTicketMessage');

            if (!title || !description) {
                messageDiv.innerHTML = '<div class="error">Preencha título e descrição</div>';
                return;
            }

            try {
                let imageUrl = null;
                if (imageFile) {
                    const fileExt = imageFile.name.split('.').pop();
                    const fileName = `${Date.now()}.${fileExt}`;
                    const { error: uploadError } = await supabase.storage
                        .from('ticket-images')
                        .upload(fileName, imageFile);
                    
                    if (!uploadError) {
                        const { data } = supabase.storage.from('ticket-images').getPublicUrl(fileName);
                        imageUrl = data.publicUrl;
                    }
                }

                const ticketId = generateTicketId();
                const { error } = await supabase.from('tickets').insert({
                    ticket_id: ticketId,
                    title,
                    description,
                    image_url: imageUrl,
                    user_id: currentUser.id,
                    status: 'open'
                });

                if (error) throw error;

                messageDiv.innerHTML = '<div class="success">Ticket criado com sucesso!</div>';
                setTimeout(() => {
                    document.getElementById('ticketTitle').value = '';
                    document.getElementById('ticketDescription').value = '';
                    document.getElementById('ticketImage').value = '';
                    showTickets();
                }, 1500);
            } catch (error) {
                messageDiv.innerHTML = `<div class="error">${error.message}</div>`;
            }
        }

        async function loadTickets() {
            const { data: tickets, error } = await supabase
                .from('tickets')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error(error);
                return;
            }

            const listDiv = document.getElementById('ticketsList');
            listDiv.innerHTML = tickets.map(ticket => `
                <div class="ticket-card" onclick="showTicketDetail('${ticket.ticket_id}')">
                    <div class="ticket-header">
                        <span class="ticket-id">#${ticket.ticket_id}</span>
                        <span class="ticket-status status-${ticket.status}">${getStatusLabel(ticket.status)}</span>
                    </div>
                    <h3>${ticket.title}</h3>
                    <p>${ticket.description.substring(0, 100)}...</p>
                    <small>${new Date(ticket.created_at).toLocaleString('pt-BR')}</small>
                </div>
            `).join('');
        }

        function getStatusLabel(status) {
            const labels = {
                open: 'Aberto',
                completed: 'Concluído',
                incomplete: 'Não Concluído'
            };
            return labels[status] || status;
        }

        async function showTicketDetail(ticketId) {
            hideAllScreens();
            document.getElementById('ticketDetailScreen').classList.remove('hidden');
            currentTicketId = ticketId;

            const { data: ticket } = await supabase
                .from('tickets')
                .select('*')
                .eq('ticket_id', ticketId)
                .single();

            document.getElementById('detailTicketId').textContent = `Ticket #${ticket.ticket_id}`;
            
            const isAdmin = currentUser.email === 'admin@admin.com';
            if (isAdmin && ticket.status === 'open') {
                document.getElementById('btnComplete').classList.remove('hidden');
                document.getElementById('btnIncomplete').classList.remove('hidden');
            } else {
                document.getElementById('btnComplete').classList.add('hidden');
                document.getElementById('btnIncomplete').classList.add('hidden');
            }

            let detailHtml = `
                <div class="ticket-card">
                    <h3>${ticket.title}</h3>
                    <p>${ticket.description}</p>
                    ${ticket.image_url ? `<img src="${ticket.image_url}" class="image-preview">` : ''}
                    <p><strong>Status:</strong> <span class="ticket-status status-${ticket.status}">${getStatusLabel(ticket.status)}</span></p>
                    <small>Criado em ${new Date(ticket.created_at).toLocaleString('pt-BR')}</small>
                </div>
            `;
            document.getElementById('ticketDetail').innerHTML = detailHtml;

            await loadComments(ticketId);
        }

        async function loadComments(ticketId) {
            const { data: comments } = await supabase
                .from('comments')
                .select('*, users(email)')
                .eq('ticket_id', ticketId)
                .order('created_at', { ascending: true });

            const commentsDiv = document.getElementById('commentsList');
            commentsDiv.innerHTML = '<h3 style="margin-top: 30px;">Comentários</h3>' + 
                (comments || []).map(comment => `
                    <div class="comment">
                        <div class="comment-header">
                            <strong>${comment.users?.email || 'Usuário'}</strong>
                            <span>${new Date(comment.created_at).toLocaleString('pt-BR')}</span>
                        </div>
                        <p>${comment.text}</p>
                        ${comment.image_url ? `<img src="${comment.image_url}" class="image-preview">` : ''}
                    </div>
                `).join('');
        }

        async function addComment() {
            const text = document.getElementById('commentText').value;
            const imageFile = document.getElementById('commentImage').files[0];

            if (!text) return;

            try {
                let imageUrl = null;
                if (imageFile) {
                    const fileExt = imageFile.name.split('.').pop();
                    const fileName = `${Date.now()}.${fileExt}`;
                    const { error: uploadError } = await supabase.storage
                        .from('ticket-images')
                        .upload(fileName, imageFile);
                    
                    if (!uploadError) {
                        const { data } = supabase.storage.from('ticket-images').getPublicUrl(fileName);
                        imageUrl = data.publicUrl;
                    }
                }

                await supabase.from('comments').insert({
                    ticket_id: currentTicketId,
                    user_id: currentUser.id,
                    text,
                    image_url: imageUrl
                });

                document.getElementById('commentText').value = '';
                document.getElementById('commentImage').value = '';
                await loadComments(currentTicketId);
            } catch (error) {
                console.error(error);
            }
        }

        async function closeTicket(status) {
            await supabase
                .from('tickets')
                .update({ status })
                .eq('ticket_id', currentTicketId);
            
            showTicketDetail(currentTicketId);
        }

        // Verificar sessão ao carregar
        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                currentUser = session.user;
                loadUserProfile();
                showMenu();
            }
        });
    </script>
</body>
</html>
